# Production overlay for docker compose.
# Usage: COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml docker compose up -d
# Or: ./start-prod.sh

services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: docker,production
      SPRING_LIQUIBASE_CONTEXTS: default
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}

  ui:
    ports:
      - "${UI_PORT:-80}:80"
