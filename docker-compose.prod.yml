# Production overlay for the single-container stack.
services:
  bioritmic:
    environment:
      SPRING_PROFILES_ACTIVE: docker,production,monolith
      SPRING_LIQUIBASE_CONTEXTS: default
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://localhost}
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      SSL_DOMAIN: ${SSL_DOMAIN:-}
      SSL_PUBLIC_IP: ${SSL_PUBLIC_IP:-}
      SSL_EXTRA_DOMAINS: ${SSL_EXTRA_DOMAINS:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-false}
      REDIRECT_HTTP_TO_HTTPS: "true"
    ports:
      - "${UI_PORT:-80}:80"
      - "${UI_HTTPS_PORT:-443}:443"
