server.port: ${API_PORT:6045}

app:
  base-url: ${APP_BASE_URL:http://localhost:6045}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:2399}
  cors:
    allowed-origins:
      - http://localhost:2399
      - http://127.0.0.1:2399
  security:
    headers:
      enabled: true
    cookies:
      secure: false
    login-lockout:
      max-attempts: 5
      lock-minutes: 15
    admin-email: ${ADMIN_EMAIL:}
  mail:
    from: ${MAIL_FROM:noreply@bioritmic.ru}
    from-name: ${MAIL_FROM_NAME:Bioritmic}
    mode: ${MAIL_MODE:smtp}

info.app.name: ${spring.application.basic-name}
info.app.description: ${spring.application.description}
info.app.version: 0.1

server.error.path: "/error"
server.error.whitelabel.enabled: false
# spring.autoconfigure.exclude: org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration

management:
  server.port: ${API_ACTUATOR_PORT:6046}
  endpoint.health.show-details: when_authorized
  endpoints.web.base-path: "/management/actuator"
  endpoints.web.exposure.include: health,info,metrics
  metrics: # DropWizard Metrics configuration, used by MetricsConfiguration
    logs: # Reports Dropwizard metrics in the logs
      enabled: false
      report-frequency: 60 # in seconds
  logging:
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      queue-size: 512

spring:
  application:
    basic-name: Bioritmic
    name: ${spring.application.basic-name}
    description: Bitoritmic app
  main.allow-bean-definition-overriding: true
  devtools.add-properties: false
  codec:
    max-in-memory-size: 50MB
  webflux:
    multipart:
      max-in-memory-size: 50MB
      max-disk-usage-per-part: 55MB
  datasource:
    master:
      host: 127.0.0.1
      port: ${POSTGRES_PORT:5433}
      database: bioritmic
      r2dbc-url: r2dbc:postgresql://${spring.datasource.master.host}:${spring.datasource.master.port}/${spring.datasource.master.database}
      jpa-url: jdbc:postgresql://${spring.datasource.master.host}:${spring.datasource.master.port}/${spring.datasource.master.database}
      driver: postgresql
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: postgres
      max-connections: 25
    slave:
      host: ${spring.datasource.master.host}
      port: ${spring.datasource.master.port}
      database: ${spring.datasource.master.database}
      r2dbc-url: r2dbc:postgresql://${spring.datasource.slave.host}:${spring.datasource.slave.port}/${spring.datasource.slave.database}
      jpa-url: jdbc:postgresql://${spring.datasource.slave.host}:${spring.datasource.slave.port}/${spring.datasource.slave.database}
      driver: ${spring.datasource.master.driver}
      driver-class-name: ${spring.datasource.master.driver-class-name}
      username: ${spring.datasource.master.username}
      password:  ${spring.datasource.master.password}
      max-connections: 20
  liquibase:
    contexts: default
    change-log: classpath:db-migrations/changelog.xml
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2587}
    username: ${MAIL_USERNAME:noreply@bioritmic.ru}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}
      "mail.smtp.ssl.trust": ${MAIL_SSL_TRUST:mail.bioritmic.ru,mail}
      "mail.smtp.ssl.checkserveridentity": "false"

s3:
  endpoint: http://localhost:${MINIO_API_PORT:19000}
  access-key: bioritmic
  secret-key: bioritmic
  bucket: bioritmic
  region: us-east-1

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  web:
    api-key: ${FIREBASE_WEB_API_KEY:}
    auth-domain: ${FIREBASE_WEB_AUTH_DOMAIN:}
    project-id: ${FIREBASE_WEB_PROJECT_ID:}
    storage-bucket: ${FIREBASE_WEB_STORAGE_BUCKET:}
    messaging-sender-id: ${FIREBASE_WEB_MESSAGING_SENDER_ID:}
    app-id: ${FIREBASE_WEB_APP_ID:}
    vapid-key: ${FIREBASE_VAPID_KEY:}

rate-limit:
  enabled: true
  public-auth:
    max-requests: 10
    window-seconds: 60
  global-ip:
    max-requests: 300
    window-seconds: 60
  user-default:
    max-requests: 120
    window-seconds: 60
  user-write:
    max-requests: 30
    window-seconds: 60
  cleanup-interval-seconds: 300
  excluded-path-prefixes:
    - /management/
    - /swagger-ui
    - /v3/api-docs
    - /error

premium:
  free-for-all: true
