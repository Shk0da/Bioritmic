# Develop mode: -Dspring.profiles.active=develop
spring.application.name: ${spring.application.basic-name} (Develop mode)
spring.devtools.add-properties: true
spring.jpa.properties.hibernate.show_sql: true
spring.jpa.properties.hibernate.use_sql_comments: false
spring.jpa.properties.hibernate.format_sql: false
spring.jpa.properties.hibernate.generate_statistics: false
logging.level.ROOT: info
logging.level.io.r2dbc.postgresql.QUERY: debug
logging.level.io.r2dbc.postgresql.PARAM: debug
logging.level.org.springframework.r2dbc.core.DefaultDatabaseClient: debug
logging.level.org.springframework.r2dbc.connection.R2dbcTransactionManager: debug
logging.level.com.github.shk0da.bioritmic.api: debug
logging.level.io.swagger.models.parameters: error

spring:
  liquibase.contexts: develop
  profiles:
    include: swagger
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@bioritmic.ru}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          ssl:
            trust: ${MAIL_SSL_TRUST:localhost,mail.bioritmic.ru}
            checkserveridentity: false

app:
  mail:
    from: ${MAIL_FROM:noreply@bioritmic.ru}
    mode: ${MAIL_MODE:smtp}
