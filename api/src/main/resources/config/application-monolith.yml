# Monolith profile: all infrastructure services run on localhost inside one container.
spring:
  datasource:
    master:
      host: 127.0.0.1
      port: 5432
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}
      "mail.smtp.ssl.trust": ${MAIL_SSL_TRUST:mail.bioritmic.ru,mail}
      "mail.smtp.ssl.checkserveridentity": "false"

s3:
  endpoint: http://127.0.0.1:9000

app:
  mail:
    from: ${MAIL_FROM:noreply@bioritmic.ru}
    from-name: ${MAIL_FROM_NAME:Bioritmic}
    mode: smtp

management:
  health:
    mail:
      enabled: false
