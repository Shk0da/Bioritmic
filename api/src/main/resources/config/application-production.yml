# Production profile: -Dspring.profiles.active=production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.github.shk0da.bioritmic: INFO
    org.springframework: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.r2dbc: WARN
    io.r2dbc: WARN
    io.r2dbc.postgresql.QUERY: WARN
    io.r2dbc.postgresql.PARAM: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      enabled: true

spring:
  mail:
    host: ${MAIL_HOST:mail}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@bioritmic.ru}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
      "mail.smtp.ssl.trust": ${MAIL_SSL_TRUST:mail.bioritmic.ru,mail}
      "mail.smtp.ssl.checkserveridentity": "false"

app:
  security:
    cookies:
      secure: true
  cors:
    allowed-origins:
      - ${APP_FRONTEND_URL:https://bioritmic.com}
  mail:
    from: ${MAIL_FROM:noreply@bioritmic.ru}
    from-name: ${MAIL_FROM_NAME:Bioritmic}
    mode: smtp
