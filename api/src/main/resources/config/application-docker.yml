# Docker Compose stack: -Dspring.profiles.active=docker
spring:
  liquibase.contexts: develop
  datasource:
    master:
      host: postgres
      port: 5432
      database: bioritmic
      username: postgres
      password: postgres
  mail:
    host: mail
    port: 587
    username: noreply@bioritmic.ru
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
      "mail.smtp.ssl.trust": mail.bioritmic.ru,mail
      "mail.smtp.ssl.checkserveridentity": "false"

s3:
  endpoint: http://minio:9000
  access-key: bioritmic
  secret-key: bioritmic
  bucket: bioritmic
  region: us-east-1

app:
  base-url: ${APP_BASE_URL:http://localhost:2399}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:2399}
  cors:
    allowed-origins:
      - ${APP_FRONTEND_URL:http://localhost:2399}
      - http://127.0.0.1:2399
  mail:
    from: noreply@bioritmic.ru
    from-name: Bioritmic
    mode: smtp

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
