services:
  postgres:
    image: postgres:16-alpine
    container_name: bioritmic-postgres
    environment:
      POSTGRES_DB: bioritmic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bioritmic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioritmic"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bioritmic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bioritmic
      MINIO_ROOT_PASSWORD: bioritmic
    ports:
      - "9340:9000"
      - "9341:9001"
    volumes:
      - bioritmic-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bioritmic-pgdata:
  bioritmic-minio-data:
