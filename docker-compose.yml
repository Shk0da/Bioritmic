services:
  postgres:
    image: postgres:16-alpine
    container_name: bioritmic-postgres
    environment:
      POSTGRES_DB: bioritmic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bioritmic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioritmic"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bioritmic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bioritmic
      MINIO_ROOT_PASSWORD: bioritmic
    ports:
      - "9340:9000"
      - "9341:9001"
    volumes:
      - bioritmic-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: bioritmic-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_MASTER_HOST: postgres
      S3_ENDPOINT: http://minio:9000
      APP_BASE_URL: http://localhost:8080
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8080:8080"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/management/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ui:
    build:
      context: ui
      dockerfile: Dockerfile
    container_name: bioritmic-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bioritmic-pgdata:
  bioritmic-minio-data:
