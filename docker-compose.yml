services:
  postgres:
    image: postgres:16-alpine
    container_name: bioritmic-postgres
    environment:
      POSTGRES_DB: bioritmic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bioritmic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioritmic"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: bioritmic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bioritmic
      MINIO_ROOT_PASSWORD: bioritmic
    ports:
      - "9340:9000"
      - "9341:9001"
    volumes:
      - bioritmic-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mail:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: bioritmic-mail
    hostname: mail.bioritmic.ru
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    volumes:
      - bioritmic-mail-data:/var/mail
      - bioritmic-mail-state:/var/mail-state
      - bioritmic-mail-logs:/var/log/mail
      - ./docker/mail/config:/tmp/docker-mailserver
    env_file:
      - ./docker/mail/mailserver.env
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ss -lntp | grep -q ':587'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  mail-init:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: bioritmic-mail-init
    depends_on:
      mail:
        condition: service_healthy
    volumes:
      - ./docker/mail/config:/tmp/docker-mailserver
      - bioritmic-mail-data:/var/mail
      - bioritmic-mail-state:/var/mail-state
    env_file:
      - ./docker/mail/mailserver.env
    environment:
      MAILBOX_PASSWORD: ${MAIL_PASSWORD:-changeme}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        setup email add noreply@bioritmic.ru "$$MAILBOX_PASSWORD" 2>/dev/null ||
        setup email update noreply@bioritmic.ru "$$MAILBOX_PASSWORD" 2>/dev/null ||
        true
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: bioritmic-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mail-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MAIL_PASSWORD: ${MAIL_PASSWORD:-changeme}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8080:8080"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/management/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  ui:
    build:
      context: ui
      dockerfile: Dockerfile
    container_name: bioritmic-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional: local SMTP catcher (not used by default stack)
  mailpit:
    profiles: ["mailpit"]
    image: axllent/mailpit:latest
    container_name: bioritmic-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  bioritmic-pgdata:
  bioritmic-minio-data:
  bioritmic-mail-data:
  bioritmic-mail-state:
  bioritmic-mail-logs:
