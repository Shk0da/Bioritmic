services:
  bioritmic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bioritmic
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker,swagger,monolith
      MAIL_PASSWORD: ${MAIL_PASSWORD:-changeme}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:2399}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:2399}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "${UI_PORT:-2399}:80"
      - "${UI_HTTPS_PORT:-2443}:443"
    volumes:
      - bioritmic-pgdata:/var/lib/postgresql/data
      - bioritmic-minio-data:/data/minio
      - bioritmic-letsencrypt:/etc/letsencrypt
      - ${SSL_CERT_DIR:-./docker/monolith/certs}:/etc/nginx/certs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1/api/v1/config/client || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

volumes:
  bioritmic-pgdata:
  bioritmic-minio-data:
  bioritmic-letsencrypt:
