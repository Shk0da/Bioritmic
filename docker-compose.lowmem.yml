# Low-memory overlay for single-container hosts (~2 GB RAM).
services:
  bioritmic:
    mem_limit: 1536m
    memswap_limit: 1536m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=60.0
        -Xms128m
        -Xmx512m
        -XX:+ExitOnOutOfMemoryError
