<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Bioritmic - Найди свою половинку</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20260629161817">
  <link rel="manifest" href="manifest.webmanifest?v=20260629161817">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260629161817">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bioritmic">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Bioritmic - сервис знакомств на основе биоритмов и совместимости">
  <meta name="theme-color" content="#fd297b">
  <style>
    /* Загрузочный экран */
    .app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fd297b 0%, #ff655b 100%);
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .app-loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: white;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 2rem;
      animation: fadeInDown 0.8s ease;
      
      .logo-couple {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 3.5rem;
        
        i {
          color: white;
          filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.3));
          
          &:first-child {
            transform: rotate(-10deg);
          }
          
          &:last-child {
            transform: rotate(10deg);
          }
        }
      }
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loader-text {
      color: white;
      font-size: 1rem;
      margin-top: 1.5rem;
      opacity: 0.9;
      animation: fadeIn 1s ease;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Загрузочный экран -->
  <div class="app-loader" id="appLoader">
    <div class="loader-logo">
      <div class="logo-couple">
        <i class="bi bi-person-heart"></i>
        <i class="bi bi-person-hearts"></i>
      </div>
      <span>Bioritmic</span>
    </div>
    <div class="loader-spinner"></div>
    <div class="loader-text">Загрузка...</div>
  </div>

  <app-root></app-root>
</body>
</html>
