server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # API proxy → backend container
    location /api/ {
        proxy_pass http://api:6045;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_intercept_errors on;
        error_page 401 = @error401;
        error_page 403 = @error403;
        error_page 404 = @error404;
        error_page 500 502 503 504 = @error500;
    }

    location @error401 { return 302 /error/401; }
    location @error403 { return 302 /error/403; }
    location @error404 { return 302 /error/404; }
    location @error500 { return 302 /error/500; }

    # Actuator proxy (for health checks)
    location /management/ {
        proxy_pass http://api:6046;
        proxy_set_header Host $host;
    }

    # Swagger proxy
    location /swagger-ui/ {
        proxy_pass http://api:6045;
        proxy_set_header Host $host;
    }
    location /v3/api-docs/ {
        proxy_pass http://api:6045;
        proxy_set_header Host $host;
    }

    # Angular SPA — all other routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(?:css|js|woff2?|ttf|eot|ico|svg|gif|jpe?g|png|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
